[project]
name = "spelacew"
version = "0.1.3"
description = "Interactive spectral line fitting and Equivalent Width measurement tool"
authors = [
    {name = "Daniel Perez"}
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "pandas>=1.3",
    "PyAstronomy>=0.20",
    "pypdf>=3.0"
]

[project.scripts]
spelacew = "spelacew.main:main"

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
